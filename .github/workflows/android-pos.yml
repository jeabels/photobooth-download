name: Android POS

on:
  push:
    paths:
      - "pos-android/**"
      - ".github/workflows/android-pos.yml"
  pull_request:
    paths:
      - "pos-android/**"
      - ".github/workflows/android-pos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with this secret the APK is built with cloud sync enabled.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.POS_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added"
          else
            echo "No Firebase config: building the offline-only variant"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Optional: with these secrets the release APK is signed and ready to install.
      - name: Decode release keystore
        env:
          POS_KEYSTORE_BASE64: ${{ secrets.POS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$POS_KEYSTORE_BASE64" ]; then
            printf '%s' "$POS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "POS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: the release APK will be unsigned"
          fi

      - name: Release APK (R8 minified)
        env:
          POS_KEYSTORE_PASSWORD: ${{ secrets.POS_KEYSTORE_PASSWORD }}
          POS_KEY_ALIAS: ${{ secrets.POS_KEY_ALIAS }}
          POS_KEY_PASSWORD: ${{ secrets.POS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: food-pos-apks
          path: pos-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: pos-android/app/build/reports/tests/
          if-no-files-found: ignore
