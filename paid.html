<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f4f0;--ink:#161616;--sub:#6b6b6b;--ok:#16a34a;--bad:#b42318;--card:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f2f2f2;--sub:#a3a3a3;--card:#1c1c1c}}
:root[data-theme="dark"]{--bg:#121212;--ink:#f2f2f2;--sub:#a3a3a3;--card:#1c1c1c}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{max-width:420px;width:100%;background:var(--card);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.icon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background:var(--ok)}
.bad .icon{background:var(--bad)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:0 0 10px}
p{color:var(--sub);font-size:17px;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon">✓</div>
  <h1 id="title">Payment received</h1>
  <p id="text">Thank you! Look at the photo booth screen: your session starts by itself.</p>
</div>
<script>
  if (new URLSearchParams(location.search).get('paid') === '0'){
    document.getElementById('card').className = 'card bad';
    document.getElementById('icon').textContent = '!';
    document.getElementById('title').textContent = 'Payment not completed';
    document.getElementById('text').textContent = 'Nothing was charged. Scan the QR on the photo booth screen to try again.';
  }
</script>
</body>
</html>
