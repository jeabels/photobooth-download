<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
/* Short links: …/rent/<shop> opens that shop's booking page, …/rent/<shop>/admin its owner page (shops are listed in rent/shops.json). */
(function(){
  var m = location.pathname.match(/^(.*\/rent)\/([A-Za-z0-9-]{2,40})(\/admin)?\/?$/);
  if(m && !/^(units|google-sheet|admin)$/i.test(m[2])) location.replace(m[1] + (m[3] ? '/admin' : '') + '/?s=' + m[2].toLowerCase() + location.hash);
})();
</script>
<style>
:root{--bg:#F7F2EE;--ink:#1C1012;--sub:#6E5A5C}
@media (prefers-color-scheme:dark){:root{--bg:#2E2526;--ink:#FAF1F1;--sub:#D2BEC0}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:0 16px;text-align:center}
p{color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This link may be mistyped or no longer in use.</p>
</main>
</body>
</html>
